<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Contact Log</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 32px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .auto-save-notice {
            background-color: #d4edda;
            color: #155724;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
            border-left: 4px solid #28a745;
        }
        .auto-save-notice strong {
            font-weight: bold;
        }
        .form-section {
            background-color: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            border-left: 5px solid #2575fc;
        }
        .form-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        label {
            font-weight: bold;
            color: #555;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input[type="text"],
        input[type="date"],
        input[type="time"],
        select,
        textarea {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        select {
            cursor: pointer;
        }
        .add-btn {
            width: 100%;
            padding: 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .add-btn:hover {
            background-color: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .log-section {
            margin-top: 30px;
        }
        .log-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .stats-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .stat-card {
            flex: 1;
            min-width: 150px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-card h3 {
            font-size: 32px;
            margin-bottom: 5px;
        }
        .stat-card p {
            font-size: 14px;
            opacity: 0.9;
        }
        .filter-section {
            background-color: #fff3cd;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .filter-section label {
            margin-bottom: 0;
        }
        .filter-section select {
            flex: 1;
            min-width: 150px;
        }
        .contact-card {
            background-color: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }
        .contact-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-color: #2575fc;
        }
        .contact-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }
        .contact-student {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }
        .contact-date {
            font-size: 14px;
            color: #666;
        }
        .contact-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            color: #555;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge.positive {
            background-color: #d4edda;
            color: #155724;
        }
        .badge.concern {
            background-color: #fff3cd;
            color: #856404;
        }
        .badge.neutral {
            background-color: #d1ecf1;
            color: #0c5460;
        }
        .badge.request {
            background-color: #e2e3e5;
            color: #383d41;
        }
        .badge.followup {
            background-color: #cfe2ff;
            color: #084298;
        }
        .badge.phone {
            background-color: #e7f3ff;
            color: #004085;
        }
        .badge.email {
            background-color: #f8d7da;
            color: #721c24;
        }
        .badge.meeting {
            background-color: #e2e3e5;
            color: #383d41;
        }
        .badge.conference {
            background-color: #d1ecf1;
            color: #0c5460;
        }
        .badge.other {
            background-color: #f8f9fa;
            color: #6c757d;
        }
        .contact-reason {
            background-color: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
            color: #333;
        }
        .contact-notes {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
            padding: 12px;
            background-color: #fafafa;
            border-radius: 8px;
        }
        .delete-btn {
            background-color: #f44336;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .delete-btn:hover {
            background-color: #da190b;
        }
        .action-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        .action-buttons button {
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        #downloadBtn {
            background-color: #2196F3;
            color: white;
        }
        #downloadBtn:hover {
            background-color: #0b7dda;
        }
        #uploadBtn {
            background-color: #ff9800;
            color: white;
        }
        #uploadBtn:hover {
            background-color: #e68900;
        }
        #clearAllBtn {
            background-color: #f44336;
            color: white;
        }
        #clearAllBtn:hover {
            background-color: #da190b;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .empty-state p {
            font-size: 16px;
        }
        #fileInput {
            display: none;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            display: none;
            border-left: 4px solid #28a745;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📞 Parent Contact Log</h1>
        <p class="subtitle">Track all parent/guardian communications in one place</p>

        <div class="auto-save-notice">
            ✅ <strong>Auto-saves automatically!</strong> Your data is saved to your browser. Download backups regularly in case you clear your cache.
        </div>

        <div class="success-message" id="successMessage"></div>

        <!-- ADD CONTACT FORM -->
        <div class="form-section">
            <h2>➕ Log New Contact</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="studentName">Student Name *</label>
                    <input type="text" id="studentName" placeholder="First Last" required>
                </div>
                <div class="form-group">
                    <label for="contactDate">Date *</label>
                    <input type="date" id="contactDate" required>
                </div>
                <div class="form-group">
                    <label for="contactTime">Time</label>
                    <input type="time" id="contactTime">
                </div>
                <div class="form-group">
                    <label for="contactType">Contact Type *</label>
                    <select id="contactType" required>
                        <option value="">Select...</option>
                        <option value="phone">Phone Call</option>
                        <option value="email">Email</option>
                        <option value="meeting">In-Person Meeting</option>
                        <option value="conference">Parent-Teacher Conference</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="contactPerson">Contact Person</label>
                    <input type="text" id="contactPerson" placeholder="Parent/Guardian name">
                </div>
                <div class="form-group">
                    <label for="contactNature">Nature of Contact *</label>
                    <select id="contactNature" required>
                        <option value="">Select...</option>
                        <option value="positive">Positive News</option>
                        <option value="concern">Concern/Issue</option>
                        <option value="neutral">General Update</option>
                        <option value="request">Parent Request</option>
                        <option value="followup">Follow-up</option>
                    </select>
                </div>
                <div class="form-group full-width">
                    <label for="contactReason">Reason for Contact *</label>
                    <input type="text" id="contactReason" placeholder="e.g., Discussed improved test scores, Behavior concern in class" required>
                </div>
                <div class="form-group full-width">
                    <label for="contactNotes">Notes / Outcome</label>
                    <textarea id="contactNotes" placeholder="Summary of conversation, action items, parent response, etc."></textarea>
                </div>
            </div>
            <button class="add-btn" onclick="addContact()">📝 Log Contact</button>
        </div>

        <!-- STATS SECTION -->
        <div class="stats-bar">
            <div class="stat-card">
                <h3 id="totalContacts">0</h3>
                <p>Total Contacts</p>
            </div>
            <div class="stat-card">
                <h3 id="thisMonth">0</h3>
                <p>This Month</p>
            </div>
            <div class="stat-card">
                <h3 id="positiveCount">0</h3>
                <p>Positive Calls</p>
            </div>
        </div>

        <!-- FILTER SECTION -->
        <div class="filter-section">
            <label for="filterType">Filter by:</label>
            <select id="filterType" onchange="filterContacts()">
                <option value="all">All Contacts</option>
                <option value="phone">Phone Calls</option>
                <option value="email">Emails</option>
                <option value="meeting">Meetings</option>
                <option value="positive">Positive News</option>
                <option value="concern">Concerns</option>
            </select>
            <select id="filterStudent" onchange="filterContacts()">
                <option value="all">All Students</option>
            </select>
        </div>

        <!-- LOG SECTION -->
        <div class="log-section">
            <h2>📋 Contact History</h2>
            <div id="contactList"></div>
            
            <div class="action-buttons">
                <button id="downloadBtn" onclick="downloadLog()">💾 Download Backup</button>
                <button id="uploadBtn" onclick="document.getElementById('fileInput').click()">📤 Restore Backup</button>
                <button id="clearAllBtn" onclick="clearAll()">🗑️ Clear All</button>
            </div>
            <input type="file" id="fileInput" accept=".json" onchange="uploadLog(event)">
        </div>
    </div>

    <script>
        var contacts = [];

        function loadContacts() {
            var saved = localStorage.getItem('parentContactLog');
            if (saved) {
                contacts = JSON.parse(saved);
            }
            updateStats();
            updateStudentFilter();
            displayContacts();
        }

        function saveContacts() {
            localStorage.setItem('parentContactLog', JSON.stringify(contacts));
        }

        function showMessage(text, isError) {
            var msg = document.getElementById('successMessage');
            msg.textContent = text;
            msg.style.display = 'block';
            msg.style.backgroundColor = isError ? '#f8d7da' : '#d4edda';
            msg.style.color = isError ? '#721c24' : '#155724';
            msg.style.borderLeftColor = isError ? '#f44336' : '#28a745';
            
            setTimeout(function() {
                msg.style.display = 'none';
            }, 4000);
        }

        function addContact() {
            var studentName = document.getElementById('studentName').value.trim();
            var contactDate = document.getElementById('contactDate').value;
            var contactTime = document.getElementById('contactTime').value;
            var contactType = document.getElementById('contactType').value;
            var contactPerson = document.getElementById('contactPerson').value.trim();
            var contactNature = document.getElementById('contactNature').value;
            var contactReason = document.getElementById('contactReason').value.trim();
            var contactNotes = document.getElementById('contactNotes').value.trim();

            if (!studentName || !contactDate || !contactType || !contactNature || !contactReason) {
                alert('Please fill in all required fields (marked with *)');
                return;
            }

            var newContact = {
                id: Date.now(),
                studentName: studentName,
                date: contactDate,
                time: contactTime,
                type: contactType,
                person: contactPerson,
                nature: contactNature,
                reason: contactReason,
                notes: contactNotes,
                timestamp: new Date().toISOString()
            };

            contacts.unshift(newContact);
            saveContacts();
            
            document.getElementById('studentName').value = '';
            document.getElementById('contactDate').value = '';
            document.getElementById('contactTime').value = '';
            document.getElementById('contactType').value = '';
            document.getElementById('contactPerson').value = '';
            document.getElementById('contactNature').value = '';
            document.getElementById('contactReason').value = '';
            document.getElementById('contactNotes').value = '';

            updateStats();
            updateStudentFilter();
            displayContacts();
            
            showMessage('✅ Contact logged and auto-saved!', false);
        }

        function deleteContact(id) {
            if (confirm('Delete this contact log entry?')) {
                contacts = contacts.filter(function(c) { return c.id !== id; });
                saveContacts();
                updateStats();
                updateStudentFilter();
                displayContacts();
                showMessage('Contact deleted', false);
            }
        }

        function updateStats() {
            document.getElementById('totalContacts').textContent = contacts.length;

            var today = new Date();
            var thisMonth = contacts.filter(function(c) {
                var contactDate = new Date(c.date);
                return contactDate.getMonth() === today.getMonth() && 
                       contactDate.getFullYear() === today.getFullYear();
            }).length;
            document.getElementById('thisMonth').textContent = thisMonth;

            var positive = contacts.filter(function(c) { return c.nature === 'positive'; }).length;
            document.getElementById('positiveCount').textContent = positive;
        }

        function updateStudentFilter() {
            var students = {};
            contacts.forEach(function(c) {
                students[c.studentName] = true;
            });

            var select = document.getElementById('filterStudent');
            var currentValue = select.value;
            select.innerHTML = '<option value="all">All Students</option>';
            
            Object.keys(students).sort().forEach(function(name) {
                var option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                select.appendChild(option);
            });
            
            select.value = currentValue;
        }

        function filterContacts() {
            displayContacts();
        }

        function displayContacts() {
            var filterType = document.getElementById('filterType').value;
            var filterStudent = document.getElementById('filterStudent').value;

            var filtered = contacts.filter(function(c) {
                var typeMatch = filterType === 'all' || c.type === filterType || c.nature === filterType;
                var studentMatch = filterStudent === 'all' || c.studentName === filterStudent;
                return typeMatch && studentMatch;
            });

            var container = document.getElementById('contactList');

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state"><h3>No contacts logged yet</h3><p>Use the form above to log your first parent contact</p></div>';
                return;
            }

            var html = '';
            filtered.forEach(function(c) {
                var typeLabel = c.type.charAt(0).toUpperCase() + c.type.slice(1);
                var natureBadgeClass = c.nature;

                html += '<div class="contact-card">';
                html += '<div class="contact-header">';
                html += '<div>';
                html += '<div class="contact-student">' + c.studentName + '</div>';
                if (c.person) {
                    html += '<div style="font-size: 14px; color: #666; margin-top: 5px;">Contact: ' + c.person + '</div>';
                }
                html += '</div>';
                html += '<button class="delete-btn" onclick="deleteContact(' + c.id + ')">Delete</button>';
                html += '</div>';
                
                html += '<div class="contact-meta">';
                html += '<div class="meta-item">📅 ' + formatDate(c.date);
                if (c.time) {
                    html += ' at ' + formatTime(c.time);
                }
                html += '</div>';
                html += '<span class="badge ' + c.type + '">' + typeLabel + '</span>';
                html += '<span class="badge ' + natureBadgeClass + '">' + c.nature.charAt(0).toUpperCase() + c.nature.slice(1) + '</span>';
                html += '</div>';

                html += '<div class="contact-reason"><strong>Reason:</strong> ' + c.reason + '</div>';
                
                if (c.notes) {
                    html += '<div class="contact-notes"><strong>Notes:</strong><br>' + c.notes + '</div>';
                }
                
                html += '</div>';
            });

            container.innerHTML = html;
        }

        function formatDate(dateStr) {
            var date = new Date(dateStr + 'T00:00:00');
            var options = { month: 'short', day: 'numeric', year: 'numeric' };
            return date.toLocaleDateString('en-US', options);
        }

        function formatTime(timeStr) {
            var parts = timeStr.split(':');
            var hour = parseInt(parts[0]);
            var minute = parts[1];
            var ampm = hour >= 12 ? 'PM' : 'AM';
            hour = hour % 12 || 12;
            return hour + ':' + minute + ' ' + ampm;
        }

        function downloadLog() {
            if (contacts.length === 0) {
                alert('No contacts to download!');
                return;
            }

            var dataStr = JSON.stringify(contacts, null, 2);
            var blob = new Blob([dataStr], { type: 'application/json' });
            var url = window.URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            var today = new Date();
            var dateStr = today.getFullYear() + '-' + 
                         String(today.getMonth() + 1).padStart(2, '0') + '-' + 
                         String(today.getDate()).padStart(2, '0');
            a.download = 'parent-contact-backup-' + dateStr + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
            
            showMessage('✅ Backup downloaded successfully!', false);
        }

        function uploadLog(event) {
            var file = event.target.files[0];
            if (!file) {
                return;
            }

            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var uploadedContacts = JSON.parse(e.target.result);
                    
                    if (!Array.isArray(uploadedContacts)) {
                        throw new Error('Invalid file format');
                    }

                    var confirmMsg = 'This will replace your current ' + contacts.length + ' contacts with ' + 
                                   uploadedContacts.length + ' contacts from the backup. Continue?';
                    
                    if (confirm(confirmMsg)) {
                        contacts = uploadedContacts;
                        saveContacts();
                        updateStats();
                        updateStudentFilter();
                        displayContacts();
                        showMessage('✅ Backup restored successfully! ' + contacts.length + ' contacts loaded.', false);
                    }
                } catch (error) {
                    showMessage('❌ Error: Invalid backup file. Please select a valid backup file.', true);
                }
            };
            reader.readAsText(file);
            
            event.target.value = '';
        }

        function clearAll() {
            if (confirm('Are you sure you want to delete ALL contact logs? This cannot be undone!')) {
                if (confirm('Really delete everything? Consider downloading a backup first!')) {
                    contacts = [];
                    saveContacts();
                    updateStats();
                    updateStudentFilter();
                    displayContacts();
                    showMessage('All contacts cleared', false);
                }
            }
        }

        window.onload = function() {
            loadContacts();
            document.getElementById('contactDate').valueAsDate = new Date();
        };
    </script>
</body>
</html>
